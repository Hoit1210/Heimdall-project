name: [Step 23] Heimdall DevSecOps - SAST & SCA Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Python SAST & SCA Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃 (Checkout Code)
        uses: actions/checkout@v4

      - name: 2. Python 3.10 환경 셋업 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 3. 보안 스캐닝 도구 및 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pip-audit
          if [ -f backend/requirements.txt ]; then pip install --only-binary=:all: -r backend/requirements.txt; fi

      - name: 4. [SAST - Linting] Flake8 코드 문법 오류 검사
        run: |
          flake8 backend/app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 5. [SAST - Security] Bandit 파이썬 코드 취약점 정적 분석
        run: |
          bandit -r backend/app/ --severity-level medium --confidence-level medium -f screen

      - name: 6. [SCA - Dependencies] pip-audit 오픈소스 라이브러리 취약점 점검
        run: |
          # 설치된 메모리 환경을 직접 스캔하여 빌드 오버헤드 및 지연 시간 방지
          pip-audit --desc --progress-spinner off
