name: Heimdall AWS OIDC Authentication Verification

on:
  push:
    branches: ["main", "develop"]
    paths:
      - 'aws-iac/**'
      - '.github/workflows/aws-oidc-ci.yml'
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  oidc-auth-verify:
    name: Verify AWS OIDC Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Heimdall-GitHubActions-OIDC-Role
          aws-region: ap-northeast-2
          role-session-name: HeimdallOIDCVerification

      - name: Verify caller identity
        run: |
          echo "Verifying STS AssumeRoleWithWebIdentity session..."
          aws sts get-caller-identity
