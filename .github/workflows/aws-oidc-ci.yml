name: [Step 25] Heimdall Keyless DevSecOps - AWS OIDC Auth

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'aws-iac/**'
      - '.github/workflows/aws-oidc-ci.yml'
  pull_request:
    branches: [ "main" ]

# [Keyless 핵심] OIDC 토큰 발급을 위해 id-token 권한을 write로 설정
permissions:
  id-token: write
  contents: read

jobs:
  keyless-auth-verify:
    name: AWS Keyless OIDC Authentication Verify
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. [Keyless Auth] AWS OIDC 자격 증명 설정 (하드코딩 키 없음!)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::225726002851:role/Heimdall-GitHubActions-OIDC-Role
          aws-region: ap-northeast-2
          role-session-name: HeimdallKeylessDevSecOpsSession

      - name: 3. 인증 성공 검증 및 STS 임시 자격 증명 확인
        run: |
          echo "====================================================="
          echo "[+] AWS Keyless OIDC 임시 자격 증명 인증 성공!"
          echo "====================================================="
          aws sts get-caller-identity
          echo "-----------------------------------------------------"
          echo "현재 세션은 IAM User의 장기 Access Key가 아닌,"
          echo "STS AssumeRoleWithWebIdentity를 통한 임시 세션입니다."
          echo "====================================================="
