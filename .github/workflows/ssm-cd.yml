name: Heimdall SSM Pull-based Deployment

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/ssm-cd.yml'

permissions:
  id-token: write
  contents: read

jobs:
  continuous-delivery:
    name: Deploy via AWS SSM Run Command
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Heimdall-GitHubActions-OIDC-Role
          aws-region: ap-northeast-2
          role-session-name: HeimdallGitHubActionsSSMDeploy

      - name: Trigger deployment with AWS SSM Run Command
        run: |
          echo "Sending deployment command to the target EC2 instance..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=["bash /home/ssm-user/heimdall-project/deploy/deploy.sh"]' \
            --comment "Triggered by GitHub Actions OIDC + SSM" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..12}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS ($((i*5))s)"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment command completed successfully."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment command failed with status: $STATUS"
              exit 1
            fi
            sleep 5
          done

          echo "Deployment status check timed out."
          exit 1
