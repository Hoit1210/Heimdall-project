name: [Step 26] Heimdall Keyless CD - AWS SSM Pull-based Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/ssm-cd.yml'

permissions:
  id-token: write
  contents: read

jobs:
  continuous-delivery:
    name: Zero-downtime CD via AWS SSM
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. [Keyless Auth] AWS OIDC 임시 자격 증명 획득
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Heimdall-GitHubActions-OIDC-Role
          aws-region: ap-northeast-2
          role-session-name: HeimdallGitHubActionsSSMDeploy

      - name: 3. [Pull-based CD] AWS SSM Run Command로 원격 무중단 배포 명령 발송
        run: |
          echo "[*] AWS SSM을 활용해 대상 EC2 인스턴스에 배포 명령을 발송합니다..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=["bash /home/ssm-user/heimdall-project/deploy/deploy.sh"]' \
            --comment "Triggered by GitHub Actions Keyless CD" \
            --query "Command.CommandId" \
            --output text)
          
          echo "[+] 발송된 SSM Command ID: $COMMAND_ID"
          echo "[*] 배포가 완료될 때까지 대기합니다 (최대 60초)..."
          
          # 배포 실행 상태 실시간 모니터링 및 성공 여부 판증
          for i in {1..12}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            
            echo "--> 현재 배포 진행 상태: $STATUS ($((i*5))초 경과)"
            if [ "$STATUS" == "Success" ]; then
              echo "�� [Deploy Pass] 무중단 배포가 성공적으로 완료되었습니다!"
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "�� [Deploy Fail] 배포 중 오류가 발생했습니다."
              exit 1
            fi
            sleep 5
          done
