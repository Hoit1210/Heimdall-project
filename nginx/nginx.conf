worker_processes auto;
events { worker_connections 1024; }
http {
    server_tokens off;
    # 표준 경로로 마운트된 물리 텍스트 파일에 로그를 직접 기록
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    upstream fastapi_backend { server web:8000; }
    server { listen 80; return 301 https://$host$request_uri; }
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/ssl/heimdall.crt;
        ssl_certificate_key /etc/nginx/ssl/heimdall.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none';" always;

        if ($query_string ~* "(union.*select|insert.*into|drop.*table|delete.*from|update.*set)") { return 403; }
        if ($request_uri ~* "(\/\.\.\/|\/\.\.|\.\.\/|\/etc\/passwd|\/windows\/win.ini)") { return 403; }
        if ($http_user_agent ~* "(sqlmap|nikto|wpscan|nmap|masscan)") { return 403; }
        if ($query_string ~* "(<script>|javascript:|onerror=|onload=)") { return 403; }

        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
