version: '3.8'
services:
  web:
    build: ./app
    container_name: heimdall-fastapi
    restart: always
    expose:
      - "8000"
  nginx:
    image: nginx:1.27-alpine
    container_name: heimdall-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/log/heimdall-nginx:/var/log/nginx:rw
    depends_on:
      - web
    restart: always
