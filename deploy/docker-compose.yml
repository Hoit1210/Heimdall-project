version: '3.8'

services:
  heimdall-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: heimdall-api:latest
    container_name: heimdall-api
    ports:
      - "8000:8000"
    restart: always
    environment:
      - PORT=8000
      - ENV=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
